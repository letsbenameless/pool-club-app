<!DOCTYPE html>
<html>
<head>
  <title>Edit Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: #171717;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      padding: 18px;
    }

    form {
      display: grid;
      gap: 18px;
      max-width: 1100px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid #333;
      border-radius: 6px;
      background: #181818;
      padding: 12px;
    }

    .field-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .line-count {
      color: #aaa;
      font-size: 13px;
      white-space: nowrap;
    }

    p {
      color: #bbb;
      line-height: 1.4;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 520px;
      background: #050505;
      color: #f5f5f5;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 10px;
      resize: vertical;
      box-sizing: border-box;
      font-size: 16px;
      line-height: 1.35;
    }

    button,
    .button-link {
      display: inline-block;
      padding: 9px 12px;
      background: #eeeeee;
      color: #111;
      border: 1px solid #555;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .week-badge {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 700px) {
      header {
        position: static;
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        padding: 12px;
      }

      .week-badge {
        position: static;
        transform: none;
      }

      .editor-grid {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 360px;
      }

      button,
      .button-link {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Edit Members</h1>
    <div class="week-badge">{{ competition.display }}</div>
  </header>

  <main>
  <form method="POST" autocomplete="off">
    <div class="editor-grid">
      <div class="panel">
        <div class="field-heading">
          <h2>Member List</h2>
          <span class="line-count" id="member-count">{{ member_count }} lines</span>
        </div>
        <p>Official members for sorting, autocomplete, and the green member labels.</p>

        <textarea id="members" name="members">{{ members_text }}</textarea>
      </div>

      <div class="panel">
        <div class="field-heading">
          <h2>Known Non-members</h2>
          <span class="line-count" id="known-non-member-count">{{ known_non_member_count }} lines</span>
        </div>
        <p>Names remembered from previous registrations that are not in the member list.</p>

        <textarea id="known_non_members" name="known_non_members">{{ known_non_members_text }}</textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit">Save Lists</button>
      <a class="button-link" href="{{ url_for('register') }}">Back</a>
    </div>
  </form>
  </main>

  <script>
  const membersField = document.getElementById("members");
  const memberCount = document.getElementById("member-count");
  const knownNonMembersField = document.getElementById("known_non_members");
  const knownNonMemberCount = document.getElementById("known-non-member-count");

  function countFieldLines(field, counter) {
    const count = field.value
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean)
      .length;

    counter.textContent = `${count} ${count === 1 ? "line" : "lines"}`;
  }

  membersField.addEventListener("input", () => {
    countFieldLines(membersField, memberCount);
  });
  knownNonMembersField.addEventListener("input", () => {
    countFieldLines(knownNonMembersField, knownNonMemberCount);
  });
  countFieldLines(membersField, memberCount);
  countFieldLines(knownNonMembersField, knownNonMemberCount);
  </script>
</body>
</html>
