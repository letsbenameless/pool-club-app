<!DOCTYPE html>
<html>
<head>
  <title>QUT Pool App Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(100% - 24px, 460px);
      border: 1px solid #333;
      border-radius: 6px;
      background: #181818;
      padding: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    form,
    label,
    .actions {
      display: grid;
      gap: 10px;
    }

    label {
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #555;
      border-radius: 6px;
      background: #050505;
      color: #f5f5f5;
      padding: 10px 11px;
      font-size: 16px;
    }

    input:focus {
      border-color: #7CFF7C;
      outline: none;
    }

    button,
    a {
      border: 1px solid #555;
      border-radius: 6px;
      background: #eeeeee;
      color: #111;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .secondary {
      background: #222;
      color: #f5f5f5;
    }

    .quiet {
      background: #2a2a2a;
      border-color: #444;
      color: #bbb;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .login-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .message {
      margin: 0 0 12px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #101010;
      color: #ddd;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.35;
    }

    .error {
      border-color: #ff9f9f;
      color: #ffd8d8;
    }

    @media (max-width: 520px) {
      body {
        box-sizing: border-box;
        min-height: 100dvh;
        overflow-y: auto;
        padding: 12px;
      }

      body.keyboard-open {
        align-items: start;
        padding: clamp(44px, 10vh, 96px) 12px max(180px, env(safe-area-inset-bottom));
      }

      main {
        width: 100%;
        margin: 0 auto;
      }

      .split {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>QUT Pool App</h1>

    {% if error %}
      <p class="message error">{{ error }}</p>
    {% endif %}
    {% if message %}
      <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('user_login') }}" autocomplete="off">
      <label>
        Email
        <input name="email" type="email" autocomplete="username" required autofocus>
      </label>

      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>

      <div class="login-row">
        <a class="secondary" href="{{ url_for('guest_registrations') }}">Continue As Guest</a>
        <button type="submit">Log In</button>
      </div>
    </form>

    <div class="actions" style="margin-top: 12px;">
      <a class="quiet" href="{{ url_for('user_signup') }}">Create User Account</a>
      <a class="quiet" href="{{ url_for('executive_signup') }}">Create Executive Account</a>
    </div>
  </main>
  <script>
    const initialViewportHeight = window.visualViewport?.height || window.innerHeight;

    function isKeyboardVisible() {
      if (!window.visualViewport) return false;

      const heightLoss = initialViewportHeight - window.visualViewport.height;
      return heightLoss > Math.max(120, initialViewportHeight * 0.18);
    }

    function updateKeyboardLayout() {
      const keyboardVisible = isKeyboardVisible();
      document.body.classList.toggle("keyboard-open", keyboardVisible);

      if (!keyboardVisible) return;

      const activeControl = document.querySelector("input:focus");
      activeControl?.scrollIntoView({
        block: "center",
        behavior: "smooth"
      });
    }

    window.visualViewport?.addEventListener("resize", updateKeyboardLayout);
    window.visualViewport?.addEventListener("scroll", updateKeyboardLayout);
    window.addEventListener("resize", updateKeyboardLayout);

    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("focus", () => {
        window.setTimeout(updateKeyboardLayout, 120);
      });

      input.addEventListener("blur", () => {
        window.setTimeout(updateKeyboardLayout, 80);
      });
    });

    updateKeyboardLayout();
  </script>
</body>
</html>
