<!DOCTYPE html>
<html>
<head>
  <title>Request Executive Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(100% - 24px, 430px);
      border: 1px solid #333;
      border-radius: 6px;
      background: #181818;
      padding: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    form,
    label {
      display: grid;
      gap: 10px;
    }

    label {
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #555;
      border-radius: 6px;
      background: #050505;
      color: #f5f5f5;
      padding: 10px 11px;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      border-color: #7CFF7C;
      outline: none;
    }

    button,
    a {
      border: 1px solid #555;
      border-radius: 6px;
      background: #eeeeee;
      color: #111;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .secondary {
      background: #222;
      color: #f5f5f5;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .message {
      margin: 0 0 12px;
      border: 1px solid #ff9f9f;
      border-radius: 6px;
      background: #101010;
      color: #ffd8d8;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.35;
    }

    @media (max-width: 520px) {
      body {
        box-sizing: border-box;
        min-height: 100dvh;
        overflow-y: auto;
        padding: 12px;
      }

      body.keyboard-open {
        align-items: start;
        padding: clamp(44px, 10vh, 96px) 12px max(180px, env(safe-area-inset-bottom));
      }

      main {
        width: 100%;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Request Executive Account</h1>

    {% if error %}
      <p class="message">{{ error }}</p>
    {% endif %}

    <form method="POST" autocomplete="off">
      <label>
        Email
        <input name="email" type="email" autocomplete="username" required autofocus>
      </label>

      <label>
        Known player
        <select name="known_player_name">
          <option value="">Choose a known player</option>
          {% for name in known_player_names %}
            <option value="{{ name }}" {% if request.form.get('known_player_name') == name %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </label>

      <label>
        Name not listed above
        <input name="new_player_name" value="{{ request.form.get('new_player_name', '') }}" maxlength="120" autocomplete="name" placeholder="Enter the executive's name">
      </label>

      <label>
        Requested role
        <select name="executive_role">
          {% for role in executive_roles %}
            <option value="{{ role }}">{{ role }}</option>
          {% endfor %}
        </select>
      </label>

      <label>
        Password
        <input name="password" type="password" autocomplete="new-password" minlength="8" required>
      </label>

      <div class="actions">
        <button type="submit">Send Request</button>
        <a class="secondary" href="{{ url_for('landing') }}">Back</a>
      </div>
    </form>
  </main>
  <script>
    const initialViewportHeight = window.visualViewport?.height || window.innerHeight;

    function isKeyboardVisible() {
      if (!window.visualViewport) return false;

      const heightLoss = initialViewportHeight - window.visualViewport.height;
      return heightLoss > Math.max(120, initialViewportHeight * 0.18);
    }

    function updateKeyboardLayout() {
      const keyboardVisible = isKeyboardVisible();
      document.body.classList.toggle("keyboard-open", keyboardVisible);

      if (!keyboardVisible) return;

      const activeControl = document.querySelector("input:focus, select:focus");
      activeControl?.scrollIntoView({
        block: "center",
        behavior: "smooth"
      });
    }

    window.visualViewport?.addEventListener("resize", updateKeyboardLayout);
    window.visualViewport?.addEventListener("scroll", updateKeyboardLayout);
    window.addEventListener("resize", updateKeyboardLayout);

    document.querySelectorAll("input, select").forEach(control => {
      control.addEventListener("focus", () => {
        window.setTimeout(updateKeyboardLayout, 120);
      });

      control.addEventListener("blur", () => {
        window.setTimeout(updateKeyboardLayout, 80);
      });
    });

    updateKeyboardLayout();
  </script>
</body>
</html>
