<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password</title>
  <style>
    * { box-sizing: border-box; }
    body { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; margin: 0; background: #101010; color: #f5f5f5; font-family: Arial, sans-serif; }
    header { margin-left: 220px; padding: 18px; border-bottom: 1px solid #333; background: #171717; }
    main { margin-left: 220px; padding: 18px; }
    .password-panel { width: min(100%, 430px); border: 1px solid #333; border-radius: 8px; background: #181818; padding: 18px; }
    .executive-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; width: 220px; border-right: 1px solid #333; background: #151515; padding: 16px 12px; }
    .sidebar-title { margin: 0 0 14px; color: #aaa; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .executive-sidebar nav { display: grid; gap: 7px; }
    .executive-sidebar a, .executive-sidebar button { width: 100%; border: 1px solid #444; border-radius: 6px; background: #222; color: #f5f5f5; padding: 9px 12px; font-size: 14px; font-weight: bold; text-align: left; text-decoration: none; cursor: pointer; }
    .executive-sidebar a.active { border-color: #7CFF7C; background: #dfffdc; color: #111; }
    .sidebar-edge-handle, .sidebar-overlay { display: none; }
    h1 { margin: 0; font-size: 23px; }
    form, label { display: grid; gap: 10px; }
    label { color: #ddd; font-size: 13px; font-weight: bold; }
    input { width: 100%; border: 1px solid #555; border-radius: 6px; background: #050505; color: #fff; padding: 10px 11px; font-size: 16px; }
    input:focus { border-color: #7CFF7C; outline: none; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    button, a { border: 1px solid #555; border-radius: 6px; padding: 10px 12px; font-size: 14px; font-weight: bold; text-align: center; text-decoration: none; cursor: pointer; }
    button { background: #eee; color: #111; }
    a { background: #222; color: #fff; }
    .error { border: 1px solid #814343; border-radius: 6px; background: #3b1919; color: #ffd0d0; padding: 10px 12px; font-size: 13px; font-weight: bold; }
    @media (max-width: 760px) {
      header, main { margin-left: 0; }
      main { padding: 12px; }
      .executive-sidebar { transform: translateX(-100%); transition: transform .2s; }
      body.sidebar-open .executive-sidebar { transform: translateX(0); }
      .sidebar-edge-handle { display: block; position: fixed; left: 8px; bottom: 8px; z-index: 40; }
      .sidebar-overlay { display: none; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.6); }
      body.sidebar-open .sidebar-overlay { display: block; }
    }
  </style>
</head>
<body>
  {% include "_executive_sidebar.html" %}
  <header><h1>Change Password</h1><p class="page-date">{{ competition.display }}</p></header>
  <main>
    <div class="password-panel">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST" autocomplete="off">
      <label>Current password
        <input name="current_password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <label>New password
        <input name="new_password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Confirm new password
        <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <div class="actions">
        <button type="submit">Change password</button>
        <a href="{{ url_for('own_account') }}">Cancel</a>
      </div>
    </form>
    </div>
  </main>
</body>
</html>
